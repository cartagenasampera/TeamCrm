<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM JIFU — Pipeline</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f1ea; color: #2a2520; }
.app { max-width: 1400px; margin: 0 auto; padding: 20px; }
 
.landing { text-align: center; padding: 80px 20px; }
.landing h1 { font-size: 48px; margin-bottom: 12px; }
.landing p { font-size: 16px; color: #8a7f73; margin-bottom: 40px; }
.buttons { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; max-width: 600px; margin: 0 auto; }
.btn { padding: 16px; border: none; border-radius: 8px; font-size: 15px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
.btn-leader { background: #e4dccd; color: #2a2520; }
.btn-leader:hover { background: #d9cdbf; }
.btn-rollup { background: #b85842; color: white; }
.btn-rollup:hover { background: #a04a35; }
 
.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding: 16px; background: white; border-radius: 8px; border: 1px solid #e4dccd; }
.header h1 { font-size: 24px; }
.header .meta { font-size: 12px; color: #8a7f73; }
.btn-back { padding: 8px 16px; background: #f0eadf; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn-back:hover { background: #e4dccd; }
.loading-bar { height: 3px; background: #b85842; position: fixed; top: 0; left: 0; width: 0; z-index: 1000; }
 
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
.kpi { background: white; padding: 16px; border-radius: 8px; border: 1px solid #e4dccd; }
.kpi-label { font-size: 11px; color: #8a7f73; text-transform: uppercase; margin-bottom: 8px; }
.kpi-value { font-size: 28px; font-weight: 600; color: #b85842; }
 
.queues { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 24px; }
.queue { background: white; border-radius: 8px; border: 1px solid #e4dccd; padding: 16px; }
.queue-title { font-size: 13px; font-weight: 600; text-transform: uppercase; color: #2a2520; margin-bottom: 12px; }
.queue-items { display: flex; flex-direction: column; gap: 8px; }
.queue-item { padding: 8px 12px; background: #f5f1ea; border-radius: 4px; font-size: 13px; cursor: pointer; }
.queue-item:hover { background: #e4dccd; }
.queue-item.empty { color: #8a7f73; font-style: italic; }
 
.table-wrapper { background: white; border-radius: 8px; border: 1px solid #e4dccd; overflow: hidden; }
.table-controls { padding: 16px; border-bottom: 1px solid #e4dccd; }
.search-input { width: 100%; padding: 10px 12px; border: 1px solid #e4dccd; border-radius: 6px; font-size: 13px; margin-bottom: 12px; }
.filters { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; }
.filters select { padding: 8px 10px; border: 1px solid #e4dccd; border-radius: 6px; font-size: 12px; background: white; cursor: pointer; }
table { width: 100%; border-collapse: collapse; }
thead { background: #f0eadf; }
th { padding: 12px; text-align: left; font-size: 11px; color: #8a7f73; text-transform: uppercase; border-bottom: 1px solid #e4dccd; }
td { padding: 11px 12px; border-bottom: 1px solid #efe8d9; font-size: 13px; }
tr:hover { background: #faf8f3; cursor: pointer; }
 
.status { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.status.activo { background: #d4e8d4; color: #2d6b2d; }
.status.proceso { background: #fff3cd; color: #856404; }
.status.inactivo { background: #f5e4dc; color: #b85842; }
.status.baja { background: #e8e8e8; color: #666; }
.status.nc { background: #f0eadf; color: #8a7f73; }
 
.tipo { padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
.tipo.lider { background: #e8d4f0; color: #6b2d7f; }
.tipo.trader { background: #d4e8f0; color: #2d6b8f; }
 
.pierna { font-weight: 600; color: #b85842; }
 
.modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; align-items: center; justify-content: center; }
.modal.active { display: flex; }
.modal-content { background: white; border-radius: 8px; padding: 24px; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
.modal h2 { margin-bottom: 16px; font-size: 18px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 12px; color: #8a7f73; text-transform: uppercase; margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid #e4dccd; border-radius: 6px; font-size: 13px; font-family: inherit; }
.form-group textarea { resize: vertical; min-height: 80px; }
.modal-buttons { display: flex; gap: 12px; margin-top: 24px; }
.btn-save { flex: 1; padding: 12px; background: #b85842; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn-save:hover { background: #a04a35; }
.btn-cancel { flex: 1; padding: 12px; background: #f0eadf; color: #2a2520; border: none; border-radius: 6px; cursor: pointer; font-weight: 500; }
.btn-cancel:hover { background: #e4dccd; }
 
.hidden { display: none; }
.sync-status { font-size: 11px; color: #8a7f73; margin-top: 8px; }
</style>
</head>
<body>
 
<div class="loading-bar" id="loadingBar"></div>
 
<div class="app">
  <div id="landing" class="landing">
    <h1>JIFU Pipeline</h1>
    <p>Selecciona tu nombre o rollup</p>
    <div class="buttons">
      <button class="btn btn-leader" onclick="selectLeader('Alejandro Cartagena')">📊 Alejandro</button>
      <button class="btn btn-leader" onclick="selectLeader('Roberto Loyo')">📊 Roberto</button>
      <button class="btn btn-leader" onclick="selectLeader('Monica Zabaleta')">📊 Mónica</button>
      <button class="btn btn-rollup" onclick="selectLeader('ROLLUP')">🎯 Rollup (Ale)</button>
    </div>
    <p class="sync-status" id="landingStatus">Cargando datos...</p>
  </div>
 
  <div id="dashboard" class="hidden">
    <div class="header">
      <div>
        <h1 id="title">Pipeline</h1>
        <p class="meta" id="meta"></p>
        <p class="sync-status" id="syncStatus">Sincronizando...</p>
      </div>
      <button class="btn-back" onclick="goBack()">← Atrás</button>
    </div>
 
    <div class="kpis">
      <div class="kpi">
        <div class="kpi-label">Total</div>
        <div class="kpi-value" id="kpi-total">—</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Activos</div>
        <div class="kpi-value" id="kpi-activos">—</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">En proceso</div>
        <div class="kpi-value" id="kpi-proceso">—</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">Rango</div>
        <div class="kpi-value" id="kpi-rango">—</div>
      </div>
    </div>
 
    <div class="queues">
      <div class="queue">
        <div class="queue-title">📍 Cerrar esta semana</div>
        <div class="queue-items" id="queue-close"></div>
      </div>
      <div class="queue">
        <div class="queue-title">🔥 Presionar tibios</div>
        <div class="queue-items" id="queue-warm"></div>
      </div>
      <div class="queue">
        <div class="queue-title">📅 Programar follow-up</div>
        <div class="queue-items" id="queue-schedule"></div>
      </div>
    </div>
 
    <div class="table-wrapper">
      <div class="table-controls">
        <input type="text" class="search-input" id="search" placeholder="Buscar por nombre, comentario...">
        <div class="filters">
          <select id="filter-lider" onchange="render()">
            <option value="">Líder: todos</option>
            <option value="Alejandro Cartagena">Alejandro</option>
            <option value="Roberto Loyo">Roberto</option>
            <option value="Monica Zabaleta">Mónica</option>
          </select>
          <select id="filter-status" onchange="render()">
            <option value="">Status: todos</option>
            <option value="Activo">Activo</option>
            <option value="En proceso">En proceso</option>
            <option value="Inactivo">Inactivo</option>
            <option value="Baja">Baja</option>
            <option value="No contact">No contact</option>
          </select>
          <select id="filter-tipo" onchange="render()">
            <option value="">Tipo: todos</option>
            <option value="Trader">Trader</option>
            <option value="Lider">Lider</option>
          </select>
          <select id="filter-pierna" onchange="render()">
            <option value="">Pierna: todos</option>
            <option value="izq">izq</option>
            <option value="der">der</option>
          </select>
        </div>
      </div>
      <table>
        <thead>
          <tr>
            <th>Nombre</th>
            <th>Status</th>
            <th>Tipo</th>
            <th>Pierna</th>
            <th>Comentario</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>
 
<div class="modal" id="modal">
  <div class="modal-content">
    <h2>Editar <span id="modal-name"></span></h2>
    <div class="form-group">
      <label>Status</label>
      <select id="modal-status">
        <option value="Activo">Activo</option>
        <option value="En proceso">En proceso</option>
        <option value="Inactivo">Inactivo</option>
        <option value="Baja">Baja</option>
        <option value="No contact">No contact</option>
      </select>
    </div>
    <div class="form-group">
      <label>Tipo</label>
      <select id="modal-tipo">
        <option value="">—</option>
        <option value="Trader">Trader</option>
        <option value="Lider">Lider</option>
      </select>
    </div>
    <div class="form-group">
      <label>Pierna Binaria</label>
      <select id="modal-pierna">
        <option value="">—</option>
        <option value="izq">izq</option>
        <option value="der">der</option>
      </select>
    </div>
    <div class="form-group">
      <label>Comentario</label>
      <textarea id="modal-comment"></textarea>
    </div>
    <div class="modal-buttons">
      <button class="btn-save" onclick="saveProspect()">Guardar</button>
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>
 
<script>
let data = [];
let currentLeader = null;
let editingProspect = null;
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/1DWQbcTNXQ1kOuoi6GtV3HWeT4_nhbTAyoEo_DxDYnOA/pub?gid=1107778853&single=true&output=csv';
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxsGNiQl3-1SUN1rExorAJX79HOGCoL2-_17MxlI6rwO7TxchK2v7uZw0_qJrotbe_EMg/exec';
 
function parseCSV(text) {
  const rows = [];
  let cur = [], field = '', inQuote = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inQuote) {
      if (c === '"' && text[i+1] === '"') { field += '"'; i++; }
      else if (c === '"') inQuote = false;
      else field += c;
    } else {
      if (c === '"') inQuote = true;
      else if (c === ',') { cur.push(field); field = ''; }
      else if (c === '\n') { cur.push(field); rows.push(cur); cur = []; field = ''; }
      else if (c !== '\r') field += c;
    }
  }
  if (field !== '' || cur.length) { cur.push(field); rows.push(cur); }
  return rows;
}
 
function loadSheet() {
  document.getElementById('loadingBar').style.width = '30%';
  fetch(SHEET_CSV_URL, { cache: 'no-store' })
    .then(res => res.text())
    .then(text => {
      document.getElementById('loadingBar').style.width = '70%';
      const rows = parseCSV(text).filter(r => r.some(c => c.trim()));
      if (rows.length < 2) {
        document.getElementById('landingStatus').textContent = 'Error: Sheet vacío';
        return;
      }
      
      const headers = rows[0].map(h => h.trim());
      data = rows.slice(1).map(row => {
        const obj = {};
        headers.forEach((h, i) => obj[h] = (row[i] || '').trim());
        return obj;
      }).filter(r => r.ID && r.Nombre);
      
      document.getElementById('loadingBar').style.width = '100%';
      setTimeout(() => { document.getElementById('loadingBar').style.width = '0'; }, 500);
      
      if (currentLeader) render();
      else {
        document.getElementById('landing').classList.remove('hidden');
        document.getElementById('landingStatus').textContent = `${data.length} prospectos cargados`;
      }
    })
    .catch(e => {
      document.getElementById('landingStatus').textContent = 'Error cargando Sheet';
      console.error('Sheet load error:', e);
    });
}
 
function selectLeader(leader) {
  currentLeader = leader;
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('dashboard').classList.remove('hidden');
  render();
}
 
function render() {
  let filtered = currentLeader === 'ROLLUP' ? data : data.filter(p => p['Líder Responsable'] === currentLeader);
  
  const liderFilter = document.getElementById('filter-lider').value;
  const statusFilter = document.getElementById('filter-status').value;
  const tipoFilter = document.getElementById('filter-tipo').value;
  const piernaFilter = document.getElementById('filter-pierna').value;
  
  if (currentLeader === 'ROLLUP' && liderFilter) filtered = filtered.filter(p => p['Líder Responsable'] === liderFilter);
  if (statusFilter) filtered = filtered.filter(p => p.Status === statusFilter);
  if (tipoFilter) filtered = filtered.filter(p => p.Tipo === tipoFilter);
  if (piernaFilter) filtered = filtered.filter(p => p['Pierna Binaria'] === piernaFilter);
  
  if (currentLeader === 'ROLLUP') {
    document.getElementById('title').textContent = 'ROLLUP — Control de equipo';
    const ale = data.filter(p => p['Líder Responsable'] === 'Alejandro Cartagena');
    const loyo = data.filter(p => p['Líder Responsable'] === 'Roberto Loyo');
    const monica = data.filter(p => p['Líder Responsable'] === 'Monica Zabaleta');
    document.getElementById('meta').innerHTML = `
      <strong>Ale:</strong> ${ale.length} total · ${ale.filter(p => p.Status === 'Activo').length} activos | 
      <strong>Loyo:</strong> ${loyo.length} total · ${loyo.filter(p => p.Status === 'Activo').length} activos | 
      <strong>Mónica:</strong> ${monica.length} total · ${monica.filter(p => p.Status === 'Activo').length} activos
    `;
  } else {
    document.getElementById('title').textContent = currentLeader.split(' ')[0];
    document.getElementById('meta').textContent = `${filtered.length} prospectos filtrados`;
  }
  
  document.getElementById('kpi-total').textContent = filtered.length;
  document.getElementById('kpi-activos').textContent = filtered.filter(p => p.Status === 'Activo').length;
  document.getElementById('kpi-proceso').textContent = filtered.filter(p => p.Status === 'En proceso').length;
  document.getElementById('kpi-rango').textContent = '—';
  
  const close = filtered.filter(p => /se inscribe|debe.*pagar|muy interesad|armar plan|entrar/.test((p.Comentario || '').toLowerCase()));
  const warm = filtered.filter(p => /seguir presionando|tibio|warm|presiona/.test((p.Comentario || '').toLowerCase()));
  const schedule = filtered.filter(p => /programar|follow|fecha|próximo/.test((p.Comentario || '').toLowerCase()));
  
  document.getElementById('queue-close').innerHTML = close.length ? close.map(p => `<div class="queue-item" onclick="editProspect('${p.ID}')">${p.Nombre}</div>`).join('') : '<div class="queue-item empty">— ninguno —</div>';
  document.getElementById('queue-warm').innerHTML = warm.length ? warm.map(p => `<div class="queue-item" onclick="editProspect('${p.ID}')">${p.Nombre}</div>`).join('') : '<div class="queue-item empty">— ninguno —</div>';
  document.getElementById('queue-schedule').innerHTML = schedule.length ? schedule.map(p => `<div class="queue-item" onclick="editProspect('${p.ID}')">${p.Nombre}</div>`).join('') : '<div class="queue-item empty">— ninguno —</div>';
  
  const q = (document.getElementById('search').value || '').toLowerCase();
  const shown = q ? filtered.filter(p => p.Nombre.toLowerCase().includes(q) || (p.Comentario || '').toLowerCase().includes(q)) : filtered;
  
  document.getElementById('tbody').innerHTML = shown.map(p => `
    <tr onclick="editProspect('${p.ID}')">
      <td><strong>${p.Nombre}</strong><br><span style="font-size:11px;color:#8a7f73;">${p['Líder Responsable'].split(' ')[0]}</span></td>
      <td><span class="status ${p.Status.toLowerCase().replace(' ', '')}">${p.Status}</span></td>
      <td>${p.Tipo ? `<span class="tipo ${p.Tipo.toLowerCase()}">${p.Tipo}</span>` : '—'}</td>
      <td>${p['Pierna Binaria'] ? `<span class="pierna">${p['Pierna Binaria']}</span>` : '—'}</td>
      <td>${(p.Comentario || '').substring(0, 50)}</td>
    </tr>
  `).join('') || '<tr><td colspan="5" style="text-align:center;color:#8a7f73;">Sin resultados</td></tr>';
}
 
function editProspect(id) {
  editingProspect = data.find(p => p.ID === id);
  if (!editingProspect) return;
  
  document.getElementById('modal-name').textContent = editingProspect.Nombre;
  document.getElementById('modal-status').value = editingProspect.Status;
  document.getElementById('modal-tipo').value = editingProspect.Tipo || '';
  document.getElementById('modal-pierna').value = editingProspect['Pierna Binaria'] || '';
  document.getElementById('modal-comment').value = editingProspect.Comentario || '';
  document.getElementById('modal').classList.add('active');
}
 
function closeModal() {
  document.getElementById('modal').classList.remove('active');
  editingProspect = null;
}
 
function saveProspect() {
  if (!editingProspect) return;
  
  editingProspect.Status = document.getElementById('modal-status').value;
  editingProspect.Tipo = document.getElementById('modal-tipo').value;
  editingProspect['Pierna Binaria'] = document.getElementById('modal-pierna').value;
  editingProspect.Comentario = document.getElementById('modal-comment').value;
  
  document.getElementById('syncStatus').textContent = 'Guardando...';
  
  fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    mode: 'no-cors',
    body: JSON.stringify({
      action: 'updateProspect',
      id: editingProspect.ID,
      status: editingProspect.Status,
      tipo: editingProspect.Tipo,
      pierna: editingProspect['Pierna Binaria'],
      comentario: editingProspect.Comentario
    })
  })
  .then(() => {
    document.getElementById('syncStatus').textContent = 'Guardado ✓';
    setTimeout(() => { document.getElementById('syncStatus').textContent = 'Sincronizado'; }, 2000);
    closeModal();
    render();
  })
  .catch(e => {
    document.getElementById('syncStatus').textContent = 'Error guardando';
    console.error('Save error:', e);
  });
}
 
function goBack() {
  currentLeader = null;
  document.getElementById('dashboard').classList.add('hidden');
  document.getElementById('landing').classList.remove('hidden');
}
 
document.getElementById('search').addEventListener('input', render);
document.getElementById('modal').addEventListener('click', e => {
  if (e.target.id === 'modal') closeModal();
});
 
loadSheet();
setInterval(loadSheet, 30000);
</script>
 
</body>
</html>
